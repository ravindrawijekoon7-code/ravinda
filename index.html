<html>
<head>

<div class="main">

        <div>

   </div>
   <div>
            <button class="re" onclick="reset()">RESET</button>
        </div>

   <div id="gust">
        <h1>AWAY</h1>

            <h2 id="mark2">0</h2>
        </div>
        <button class="gr"  onclick="add4()">+1</button>
        <button class="gr"  onclick="add5()">+2</button>
        <button class="gr"  onclick="add6()">+3</button>
        <div>
            <button class="re" onclick="set0g()">Set to 0 GUST side</button>
            <button class="re" onclick="dreg()">-1</button>
            
        </div>
   </div>
 </div>
